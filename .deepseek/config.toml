# CLAUDART DeepSeek layer — optional project-local harness configuration.
#
# DeepSeek terminal harnesses differ in which project-local settings they read,
# and several keep their configuration at the user level (for example
# ~/.deepseek/config.toml) rather than in the project. CLAUDART therefore ships
# this file empty on purpose: do not add a key until you have confirmed your
# harness reads it from the project, or it will silently do nothing.
#
# The delegation ceiling that matters is documented in
# .deepseek/guidelines/agent-delegation.md, which does not depend on this file.
# If your harness exposes a project-local subagent concurrency cap, set it
# conservatively under the table name that harness documents, for example:
#
# [agents]
# max_concurrent_threads_per_session = 6
